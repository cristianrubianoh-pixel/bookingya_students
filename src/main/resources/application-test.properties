spring.application.name=bookingya-test
server.servlet.context-path=/api

# Import opcional .env (puede no existir en CI): no falla si falta
spring.config.import=optional:file:.env[.properties]

# H2 en memoria: perfil para pruebas automatizadas y arranque ligero (ATDD/CI)
spring.datasource.url=jdbc:h2:mem:bookingya_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never
