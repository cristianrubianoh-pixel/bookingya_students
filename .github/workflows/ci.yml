name: Java CI with Maven

on:
  push:
    branches: [ "main", "estudiantes", "dev-sc" ]
  pull_request:
    branches: [ "main", "estudiantes", "dev-sc" ]

jobs:
  verify-and-atdd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven verify (JUnit + Cucumber/Serenity + reporte)
        run: mvn -B clean verify --file pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias npm y Chromium (Playwright)
        run: npm ci && npx playwright install chromium --with-deps

      - name: Arrancar API (perfil test / H2) y ejecutar ATDD
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          java -jar target/bookingya-0.0.1-SNAPSHOT.jar --spring.profiles.active=test &
          APP_PID=$!
          READY=0
          for i in $(seq 1 45); do
            if curl -sf "$BASE_URL/api/room" > /dev/null; then
              echo "API disponible"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::La API no respondió a tiempo en $BASE_URL"
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          npx playwright test
          kill "$APP_PID" 2>/dev/null || true
